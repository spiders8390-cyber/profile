type User @table {
  username: String!
  email: String!
  createdAt: Timestamp!
  displayName: String
  bio: String
  profilePictureUrl: String
  websiteUrl: String
}

type Portfolio @table {
  user: User!
  name: String!
  createdAt: Timestamp!
  description: String
  themeSettings: String
}

type Project @table {
  portfolio: Portfolio!
  title: String!
  createdAt: Timestamp!
  description: String
  tags: [String]
  isPublic: Boolean
}

type MediaItem @table {
  project: Project!
  mediaUrl: String!
  mediaType: String!
  createdAt: Timestamp!
  caption: String
  orderIndex: Int
  isFeatured: Boolean
}

type AnalyticsEvent @table {
  portfolio: Portfolio!
  project: Project
  eventType: String!
  timestamp: Timestamp!
  viewerIpAddress: String
  viewerUserAgent: String
}